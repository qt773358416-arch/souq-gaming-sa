<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--panel2:#172238;--line:#263650;--text:#f4f7ff;--muted:#9aa9c2;--cyan:#35d8e8;--violet:#9875ff;--red:#ff647d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#18365a 0,transparent 40%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(1120px,94%);margin:auto}.top{height:68px;border-bottom:1px solid #ffffff14;background:#090d18ed;position:sticky;top:0;z-index:5}.topin{height:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;display:flex;align-items:center;gap:9px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:linear-gradient(110deg,#2dc9dc,#697cf6);color:#06101b;border:0}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:18px;padding:22px 0}.player{position:relative;aspect-ratio:16/9;background:#05080f;border:1px solid var(--line);border-radius:20px;display:grid;place-items:center;text-align:center;padding:0;overflow:hidden}.player>video,.player>div:not(.live-stage-top):not(.live-chat-overlay){position:relative;z-index:1}.live-stage-top{position:absolute;top:12px;right:12px;left:12px;z-index:5;display:flex;justify-content:space-between;pointer-events:none}.live-stage-pill{background:#07101dcc;border:1px solid #ffffff25;border-radius:999px;padding:7px 12px;font-weight:850}.live-chat-overlay{position:absolute;z-index:5;right:12px;left:12px;bottom:14px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;max-height:42%;overflow:hidden;pointer-events:none}.live-chat-bubble{max-width:88%;background:#07101dbd;border:1px solid #ffffff20;border-radius:14px;padding:7px 11px;line-height:1.45;text-align:right;overflow-wrap:anywhere;animation:chatIn .22s ease-out}.live-chat-bubble b{color:#78e8f1;margin-left:5px}@keyframes chatIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.player .big{font-size:56px}.player p{color:var(--muted);line-height:1.8;max-width:540px}.title{font-size:clamp(21px,4vw,30px);margin:18px 0 8px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.panel{background:linear-gradient(180deg,#131e31,#0f1726);border:1px solid var(--line);border-radius:18px;padding:16px}.host{display:flex;align-items:center;gap:12px;margin-top:14px}.avatar{width:44px;height:44px;border-radius:50%;background:#294467;display:grid;place-items:center;font-weight:900}.chat{display:flex;flex-direction:column;min-height:570px;max-height:calc(100vh - 120px)}.chathead{font-size:18px;font-weight:900;padding-bottom:12px;border-bottom:1px solid var(--line)}.messages{overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px;padding:14px 0}.msg{background:#18263b;border-radius:12px;padding:9px 11px;line-height:1.6;overflow-wrap:anywhere}.msg strong{color:#79e7f2;margin-left:6px}.composer{display:flex;gap:8px}.composer input{min-width:0;flex:1;background:#0b1322;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}.notice,.empty{border:1px dashed #40516c;border-radius:14px;padding:16px;text-align:center;color:var(--muted);line-height:1.8}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#18263b;border:1px solid #3a5577;border-radius:12px;padding:12px 16px;display:none;z-index:10}.hidden{display:none!important}.watch-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.watch-actions .btn{flex:1;min-width:105px}.liked{background:linear-gradient(110deg,#ff6b91,#ff9d70)!important;color:#260713!important;border:0!important}.report-box{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#0d1626}.report-box select,.report-box textarea{width:100%;margin:7px 0;background:#0b1322;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.chat-collapsed .chat{display:none!important}.chat-collapsed .layout{grid-template-columns:1fr!important}.player:fullscreen{width:100vw;height:100vh;max-height:100vh;aspect-ratio:auto;border:0;border-radius:0}.player:fullscreen #liveVideo{width:100%!important;height:100%!important;object-fit:contain!important}
@media(max-width:760px){.layout{grid-template-columns:1fr;padding:10px 0}.chat{min-height:340px;max-height:48vh}.player{aspect-ratio:9/16;max-height:76vh;min-height:420px;border-radius:15px}.topin .btn{font-size:12px;padding:9px}.player #liveVideo{object-fit:cover!important}}
</style></head>
<body>
<header class="top"><div class="wrap topin"><a class="brand" href="gaming-live.html"><span class="logo">🎮</span><span>Gaming Live</span></a><a class="btn" href="gaming-live.html">العودة للمجتمع</a></div></header>
<main class="wrap layout">
<section>
<div class="player" id="player">
<video id="liveVideo" controls playsinline autoplay style="width:100%;height:100%;max-height:100%;display:none;background:#000;object-fit:contain"></video>
<div id="playerPlaceholder"><div class="big">🎮</div><h2>جاري الاتصال بالبث</h2><p id="playerState">جارٍ تحميل بيانات البث…</p></div>
<div class="live-stage-top"><span class="live-stage-pill" id="liveBadge">● مباشر</span><span class="live-stage-pill" id="liveViewerBadge">0 مشاهد</span></div>
<div id="liveChatOverlay" class="live-chat-overlay" aria-live="polite"></div>
</div>
<h1 class="title" id="streamTitle">مشاهدة البث</h1>
<div class="row muted"><span id="gameName">اللعبة</span><span>•</span><span id="viewerCount">— مشاهد</span><span>•</span><span id="streamState">الحالة</span></div>
<div class="panel host"><div class="avatar" id="hostAvatar">؟</div><div style="flex:1"><strong id="hostName">اللاعب</strong><div class="muted" id="hostHandle"></div></div><button class="btn primary" id="followBtn">متابعة اللاعب</button></div>
<div class="watch-actions">
<button class="btn" id="likeBtn" type="button">♡ إعجاب <span id="likeCount">0</span></button>
<button class="btn" id="shareBtn" type="button">↗ مشاركة</button>
<button class="btn" id="chatToggleBtn" type="button">إخفاء المحادثة</button>
<button class="btn" id="fullscreenBtn" type="button">ملء الشاشة</button>
<button class="btn" id="reportBtn" type="button">⚑ إبلاغ</button>
</div>
<div class="report-box hidden" id="reportBox">
<strong>الإبلاغ عن هذا البث</strong>
<select id="reportReason"><option value="محتوى مخالف">محتوى مخالف</option><option value="إساءة أو تنمر">إساءة أو تنمر</option><option value="محتوى غير مناسب">محتوى غير مناسب</option><option value="احتيال أو تضليل">احتيال أو تضليل</option><option value="حقوق ملكية">حقوق ملكية</option><option value="سبب آخر">سبب آخر</option></select>
<textarea id="reportDetails" rows="3" maxlength="1000" placeholder="تفاصيل إضافية (اختياري)"></textarea>
<div class="row"><button class="btn primary" id="sendReportBtn" type="button">إرسال البلاغ</button><button class="btn" id="cancelReportBtn" type="button">إلغاء</button></div>
</div>
<div class="panel" style="margin-top:14px"><h3>عن البث</h3><p class="muted" id="streamDescription">لا يوجد وصف.</p></div>
</section>
<aside class="panel chat"><div class="chathead">💬 محادثة البث</div><div id="chatMessages" class="messages"><div class="empty">جارٍ تحميل التعليقات…</div></div><form id="chatForm" class="composer"><input id="chatInput" maxlength="500" placeholder="اكتب تعليقك…" autocomplete="off"><button class="btn primary" type="submit">إرسال</button></form><p class="muted" id="chatHint" style="font-size:12px;margin-bottom:0">يجب تسجيل الدخول لإرسال تعليق.</p></aside>
</main><div class="wrap"><div id="pageError" class="notice hidden"></div></div><div class="toast" id="toast"></div>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.24.0.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const URL='https://hmcsgkavqdsfwqomxakw.supabase.co';const KEY='sb_publishable_I2FLI3drU7_xB8tWWGjnOg_b6Sm2j2m';
const db=window.supabase.createClient(URL,KEY,{db:{schema:'gaming_live'},auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const streamId=params.get('id');let session=null,profile=null,user=null,channel=null,rtcClient=null,presenceChannel=null,liked=false,likesChannel=null;

async function playLive(src){const video=$('liveVideo');$('playerPlaceholder').classList.add('hidden');video.style.display='block';if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=src;video.play().catch(()=>{});return;}await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/hls.js@latest';script.onload=resolve;script.onerror=()=>reject(new Error('تعذر تحميل مشغل HLS.'));document.head.appendChild(script);});if(window.Hls&&Hls.isSupported()){const hls=new Hls({enableWorker:true,lowLatencyMode:false});hls.loadSource(src);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal){$('playerPlaceholder').classList.remove('hidden');video.style.display='none';$('playerState').textContent='تعذر تشغيل الفيديو. أعد المحاولة لاحقًا.';}});}else{throw new Error('المتصفح لا يدعم تشغيل HLS.');}}
async function joinAgoraViewer(){
 const auth=await db.auth.getSession();const access=auth.data.session?.access_token;
 if(!access)throw new Error('سجّل الدخول لمشاهدة هذا البث.');
 const response=await fetch('/api/gaming-live-token',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+access},body:JSON.stringify({session_id:session.id})});
 const data=await response.json();if(!response.ok)throw new Error(data.error||'تعذر إصدار رمز المشاهدة.');
 const Agora=window.AgoraRTC;if(!Agora||!Agora.createClient)throw new Error('مكتبة Agora لم تُحمّل. أعد فتح الصفحة.');
 rtcClient=Agora.createClient({mode:'live',codec:'vp8'});
 rtcClient.on('user-joined',()=>{$('playerState').textContent='تم العثور على المذيع. جارٍ استقبال الفيديو…';});
 rtcClient.on('user-published',async(remoteUser,mediaType)=>{
   await rtcClient.subscribe(remoteUser,mediaType);
   if(mediaType==='video'){
     $('playerPlaceholder').classList.add('hidden');
     $('liveVideo').style.display='none';
     remoteUser.videoTrack.play($('player'));
     $('playerState').textContent='الفيديو مباشر الآن.';
   }
   if(mediaType==='audio'){remoteUser.audioTrack.play();$('playerState').textContent='الصوت متصل.';}
 });
 rtcClient.on('user-unpublished',(_,mediaType)=>{if(mediaType==='video'){$('playerPlaceholder').classList.remove('hidden');$('playerState').textContent='توقف فيديو المذيع مؤقتًا.';}});
 rtcClient.on('user-left',()=>{$('playerPlaceholder').classList.remove('hidden');$('playerState').textContent='انقطع اتصال المذيع. ننتظر عودته…';});
 await rtcClient.setClientRole('audience');
 await rtcClient.join(data.app_id,data.channel,data.token,data.uid);
 $('playerState').textContent='تم دخول قناة البث. ننتظر بث الكاميرا…';
}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function err(t){$('pageError').textContent=t;$('pageError').classList.remove('hidden')}
function addMessage(m,p){
 const name=p?.display_name||p?.username||'لاعب';
 const d=document.createElement('div');d.className='msg';const n=document.createElement('strong');n.textContent=name+':';const s=document.createElement('span');s.textContent=m.message;d.append(n,s);$('chatMessages').append(d);$('chatMessages').scrollTop=$('chatMessages').scrollHeight;
 const bubble=document.createElement('div');bubble.className='live-chat-bubble';const bn=document.createElement('b');bn.textContent=name+':';const bt=document.createElement('span');bt.textContent=m.message;bubble.append(bn,bt);$('liveChatOverlay').append(bubble);while($('liveChatOverlay').children.length>6)$('liveChatOverlay').removeChild($('liveChatOverlay').firstChild);
}
async function loadLikeState(){
 if(!session)return;
 const count=await db.from('stream_likes').select('user_id',{count:'exact',head:true}).eq('session_id',streamId);
 if(count.error){$('likeCount').textContent='—';return;}
 $('likeCount').textContent=Number(count.count||0).toLocaleString('ar-SA');
 if(user){const mine=await db.from('stream_likes').select('user_id').eq('session_id',streamId).eq('user_id',user.id).maybeSingle();liked=!!mine.data;}
 paintLike();
 likesChannel=db.channel('gl-likes-'+streamId).on('postgres_changes',{event:'*',schema:'gaming_live',table:'stream_likes',filter:'session_id=eq.'+streamId},async()=>{
  const c=await db.from('stream_likes').select('user_id',{count:'exact',head:true}).eq('session_id',streamId);
  if(!c.error)$('likeCount').textContent=Number(c.count||0).toLocaleString('ar-SA');
  if(user){const m=await db.from('stream_likes').select('user_id').eq('session_id',streamId).eq('user_id',user.id).maybeSingle();liked=!!m.data;paintLike();}
 }).subscribe();
}
function paintLike(){$('likeBtn').classList.toggle('liked',liked);$('likeBtn').innerHTML=(liked?'♥':'♡')+' '+(liked?'أعجبني':'إعجاب')+' <span id="likeCount">'+$('likeCount').textContent+'</span>';}
$('likeBtn').addEventListener('click',async()=>{
 if(!user){toast('سجّل الدخول للتفاعل مع البث.');return;}
 const q=await db.from('stream_likes').select('user_id').eq('session_id',streamId).eq('user_id',user.id).maybeSingle();
 let result;if(q.data)result=await db.from('stream_likes').delete().eq('session_id',streamId).eq('user_id',user.id);else result=await db.from('stream_likes').insert({session_id:streamId,user_id:user.id});
 if(result.error){toast(result.error.message);return;}liked=!q.data;paintLike();
 const c=await db.from('stream_likes').select('user_id',{count:'exact',head:true}).eq('session_id',streamId);if(!c.error)$('likeCount').textContent=Number(c.count||0).toLocaleString('ar-SA');
});
$('shareBtn').addEventListener('click',async()=>{const url=location.href;try{if(navigator.share)await navigator.share({title:$('streamTitle').textContent,text:'شاهد هذا البث على Gaming Live',url});else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url);toast('تم نسخ رابط البث.');}else toast('انسخ رابط الصفحة لمشاركته.');}catch(e){if(e.name!=='AbortError')toast('تعذرت المشاركة من هذا المتصفح.');}});
$('chatToggleBtn').addEventListener('click',()=>{const hidden=document.body.classList.toggle('chat-collapsed');$('chatToggleBtn').textContent=hidden?'إظهار المحادثة':'إخفاء المحادثة';});
$('fullscreenBtn').addEventListener('click',async()=>{try{const target=$('player');if(!document.fullscreenElement){if(target.requestFullscreen)await target.requestFullscreen();else if($('liveVideo').webkitEnterFullscreen)$('liveVideo').webkitEnterFullscreen();else toast('ملء الشاشة غير مدعوم في هذا المتصفح.');}else await document.exitFullscreen();}catch(e){toast('تعذر تفعيل ملء الشاشة.');}});
$('reportBtn').addEventListener('click',()=>{if(!user){toast('سجّل الدخول لإرسال بلاغ.');return;}$('reportBox').classList.toggle('hidden');});
$('cancelReportBtn').addEventListener('click',()=>$('reportBox').classList.add('hidden'));
$('sendReportBtn').addEventListener('click',async()=>{if(!user){toast('سجّل الدخول لإرسال بلاغ.');return;}if(user.id===session?.host_user_id){toast('لا يمكنك الإبلاغ عن بثك.');return;}const reason=$('reportReason').value;const details=$('reportDetails').value.trim();const btn=$('sendReportBtn');btn.disabled=true;try{const r=await db.from('content_reports').insert({reporter_user_id:user.id,session_id:streamId,reported_user_id:session.host_user_id,reason,details});if(r.error)throw r.error;$('reportBox').classList.add('hidden');$('reportDetails').value='';toast('تم استلام بلاغك وسيُراجع من فريق الإشراف.');}catch(e){toast('تعذر إرسال البلاغ: '+e.message);}finally{btn.disabled=false;}});
async function load(){if(!streamId){err('رابط البث غير مكتمل. افتح البث من قائمة مجتمع Gaming Live.');$('playerState').textContent='لم يتم تحديد بث.';return}
const auth=await db.auth.getSession();user=auth.data.session?.user||null;
const r=await db.from('stream_sessions').select('id,host_user_id,category_id,title,description,status,provider,playback_uid,playback_url,thumbnail_url,viewer_count,started_at').eq('id',streamId).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('البث غير موجود أو غير متاح للمشاهدة.');session=r.data;
$('streamTitle').textContent=session.title;$('streamDescription').textContent=session.description||'لا يوجد وصف.';$('viewerCount').textContent=Number(session.viewer_count||0).toLocaleString('ar-SA')+' مشاهد';$('streamState').textContent=session.status==='live'?'مباشر':session.status;if(session.status==='live'&&session.provider==='agora_rtc'){await joinAgoraViewer();}else if(session.status==='live'&&session.playback_url){await playLive(session.playback_url);}else{$('playerState').textContent=session.status==='live'?'رابط المشاهدة غير متاح.':'هذا البث ليس مباشرًا حاليًا.';}
const cat=await db.from('game_categories').select('name').eq('id',session.category_id).maybeSingle();$('gameName').textContent=cat.data?.name||'ألعاب';
const pr=await db.from('player_profiles').select('user_id,username,display_name,avatar_url').eq('user_id',session.host_user_id).maybeSingle();profile=pr.data;$('hostName').textContent=profile?.display_name||profile?.username||'لاعب';$('hostHandle').textContent=profile?.username?'@'+profile.username:'';$('hostAvatar').textContent=(profile?.display_name||profile?.username||'ل').slice(0,1);
if(user&&profile){const f=await db.from('player_follows').select('follower_user_id').eq('follower_user_id',user.id).eq('followed_user_id',profile.user_id).maybeSingle();$('followBtn').textContent=f.data?'إلغاء المتابعة':'متابعة اللاعب';}else{$('followBtn').textContent='سجّل الدخول للمتابعة'}
await loadMessages();await loadLikeState();if(session.status==='live'){channel=db.channel('gl-chat-'+streamId).on('postgres_changes',{event:'INSERT',schema:'gaming_live',table:'stream_messages',filter:'session_id=eq.'+streamId},async payload=>{const msg=payload.new;const p=await db.from('player_profiles').select('username,display_name').eq('user_id',msg.user_id).maybeSingle();addMessage(msg,p.data);}).subscribe();}
if(session.status==='live'&&user){
 presenceChannel=db.channel('gl-presence-'+streamId,{config:{presence:{key:user.id}}})
 .on('presence',{event:'sync'},()=>{const state=presenceChannel.presenceState();let total=0;Object.values(state).forEach(list=>total+=list.length);$('viewerCount').textContent=total.toLocaleString('ar-SA')+' مشاهد';$('liveViewerBadge').textContent=total.toLocaleString('ar-SA')+' مشاهد';})
 .subscribe(async status=>{if(status==='SUBSCRIBED')await presenceChannel.track({role:user.id===session.host_user_id?'host':'viewer',at:new Date().toISOString()});});
}
$('chatHint').textContent=user?'التعليقات تخضع لإشراف مجتمع القيمنق.':'سجّل الدخول من سوق القيمنق لإرسال تعليق.';
}
async function loadMessages(){const r=await db.from('stream_messages').select('id,user_id,message,created_at').eq('session_id',streamId).eq('state','visible').order('created_at',{ascending:true}).limit(100);if(r.error)throw r.error;$('chatMessages').innerHTML='';if(!r.data.length){$('chatMessages').innerHTML='<div class="empty">لا توجد تعليقات بعد. ابدأ المحادثة باحترام.</div>';return}const ids=[...new Set(r.data.map(x=>x.user_id))];const ps=await db.from('player_profiles').select('user_id,username,display_name').in('user_id',ids);const map=new Map((ps.data||[]).map(p=>[p.user_id,p]));r.data.forEach(m=>addMessage(m,map.get(m.user_id)));}
$('followBtn').addEventListener('click',async()=>{if(!user){toast('سجّل الدخول أولًا من سوق القيمنق.');return}if(!profile||profile.user_id===user.id){toast('لا يمكنك متابعة نفسك.');return}const q=await db.from('player_follows').select('follower_user_id').eq('follower_user_id',user.id).eq('followed_user_id',profile.user_id).maybeSingle();let res;if(q.data)res=await db.from('player_follows').delete().eq('follower_user_id',user.id).eq('followed_user_id',profile.user_id);else res=await db.from('player_follows').insert({follower_user_id:user.id,followed_user_id:profile.user_id});if(res.error){toast(res.error.message);return}$('followBtn').textContent=q.data?'متابعة اللاعب':'إلغاء المتابعة';});
$('chatForm').addEventListener('submit',async e=>{e.preventDefault();const text=$('chatInput').value.trim();if(!text)return;if(!user){toast('سجّل الدخول لإرسال تعليق.');return}if(!session||session.status!=='live'){toast('التعليقات متاحة أثناء البث المباشر فقط.');return}const r=await db.from('stream_messages').insert({session_id:streamId,user_id:user.id,message:text});if(r.error){toast(r.error.message);return}$('chatInput').value='';});
load().catch(e=>{console.error(e);err(e.message||'تعذر تحميل البث.');$('playerState').textContent='تعذر تحميل بيانات البث.';});

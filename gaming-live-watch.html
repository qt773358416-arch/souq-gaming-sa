<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d18"><title>مشاهدة البث | Gaming Live</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--panel2:#172238;--line:#263650;--text:#f4f7ff;--muted:#9aa9c2;--cyan:#35d8e8;--violet:#9875ff;--red:#ff647d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#18365a 0,transparent 40%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(1120px,94%);margin:auto}.top{height:68px;border-bottom:1px solid #ffffff14;background:#090d18ed;position:sticky;top:0;z-index:5}.topin{height:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;display:flex;align-items:center;gap:9px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:linear-gradient(110deg,#2dc9dc,#697cf6);color:#06101b;border:0}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:18px;padding:22px 0}.player{aspect-ratio:16/9;background:linear-gradient(145deg,#14243b,#080d18);border:1px solid var(--line);border-radius:20px;display:grid;place-items:center;text-align:center;padding:22px;overflow:hidden}.player .big{font-size:56px}.player p{color:var(--muted);line-height:1.8;max-width:540px}.title{font-size:clamp(21px,4vw,30px);margin:18px 0 8px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.panel{background:linear-gradient(180deg,#131e31,#0f1726);border:1px solid var(--line);border-radius:18px;padding:16px}.host{display:flex;align-items:center;gap:12px;margin-top:14px}.avatar{width:44px;height:44px;border-radius:50%;background:#294467;display:grid;place-items:center;font-weight:900}.chat{display:flex;flex-direction:column;min-height:570px;max-height:calc(100vh - 120px)}.chathead{font-size:18px;font-weight:900;padding-bottom:12px;border-bottom:1px solid var(--line)}.messages{overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px;padding:14px 0}.msg{background:#18263b;border-radius:12px;padding:9px 11px;line-height:1.6;overflow-wrap:anywhere}.msg strong{color:#79e7f2;margin-left:6px}.composer{display:flex;gap:8px}.composer input{min-width:0;flex:1;background:#0b1322;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}.notice,.empty{border:1px dashed #40516c;border-radius:14px;padding:16px;text-align:center;color:var(--muted);line-height:1.8}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#18263b;border:1px solid #3a5577;border-radius:12px;padding:12px 16px;display:none;z-index:10}.hidden{display:none!important}
@media(max-width:760px){.layout{grid-template-columns:1fr}.chat{min-height:420px;max-height:65vh}.player{border-radius:15px}.topin .btn{font-size:12px;padding:9px}}
</style></head>
<body>
<header class="top"><div class="wrap topin"><a class="brand" href="gaming-live.html"><span class="logo">🎮</span><span>Gaming Live</span></a><a class="btn" href="gaming-live.html">العودة للمجتمع</a></div></header>
<main class="wrap layout">
<section>
<div class="player" id="player"><video id="liveVideo" controls playsinline style="width:100%;height:100%;max-height:100%;display:none;background:#000;border-radius:14px"></video><div id="playerPlaceholder"><div class="big">🎮</div><h2>مشغل البث</h2><p id="playerState">جارٍ تحميل بيانات البث…</p></div></div>
<h1 class="title" id="streamTitle">مشاهدة البث</h1>
<div class="row muted"><span id="gameName">اللعبة</span><span>•</span><span id="viewerCount">— مشاهد</span><span>•</span><span id="streamState">الحالة</span></div>
<div class="panel host"><div class="avatar" id="hostAvatar">؟</div><div style="flex:1"><strong id="hostName">اللاعب</strong><div class="muted" id="hostHandle"></div></div><button class="btn primary" id="followBtn">متابعة اللاعب</button></div>
<div class="panel" style="margin-top:14px"><h3>عن البث</h3><p class="muted" id="streamDescription">لا يوجد وصف.</p></div>
</section>
<aside class="panel chat"><div class="chathead">💬 محادثة البث</div><div id="chatMessages" class="messages"><div class="empty">جارٍ تحميل التعليقات…</div></div><form id="chatForm" class="composer"><input id="chatInput" maxlength="500" placeholder="اكتب تعليقك…" autocomplete="off"><button class="btn primary" type="submit">إرسال</button></form><p class="muted" id="chatHint" style="font-size:12px;margin-bottom:0">يجب تسجيل الدخول لإرسال تعليق.</p></aside>
</main><div class="wrap"><div id="pageError" class="notice hidden"></div></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.24.0/AgoraRTC_N-4.24.0.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const URL='https://hmcsgkavqdsfwqomxakw.supabase.co';const KEY='sb_publishable_I2FLI3drU7_xB8tWWGjnOg_b6Sm2j2m';
const db=window.supabase.createClient(URL,KEY,{db:{schema:'gaming_live'},auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const streamId=params.get('id');let session=null,profile=null,user=null,channel=null,rtcClient=null;

async function playLive(src){const video=$('liveVideo');$('playerPlaceholder').classList.add('hidden');video.style.display='block';if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=src;video.play().catch(()=>{});return;}await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/hls.js@latest';script.onload=resolve;script.onerror=()=>reject(new Error('تعذر تحميل مشغل HLS.'));document.head.appendChild(script);});if(window.Hls&&Hls.isSupported()){const hls=new Hls({enableWorker:true,lowLatencyMode:false});hls.loadSource(src);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal){$('playerPlaceholder').classList.remove('hidden');video.style.display='none';$('playerState').textContent='تعذر تشغيل الفيديو. أعد المحاولة لاحقًا.';}});}else{throw new Error('المتصفح لا يدعم تشغيل HLS.');}}
async function joinAgoraViewer(){const auth=await db.auth.getSession();const access=auth.data.session?.access_token;if(!access)throw new Error('سجّل الدخول لمشاهدة هذا البث التجريبي.');const response=await fetch('/api/gaming-live-token',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+access},body:JSON.stringify({session_id:session.id})});const data=await response.json();if(!response.ok)throw new Error(data.error||'تعذر إصدار رمز المشاهدة.');rtcClient=AgoraRTC.createClient({mode:'live',codec:'vp8'});await rtcClient.setClientRole('audience');rtcClient.on('user-published',async(remoteUser,mediaType)=>{await rtcClient.subscribe(remoteUser,mediaType);if(mediaType==='video'){const holder=$('player');$('playerPlaceholder').classList.add('hidden');remoteUser.videoTrack.play(holder);}if(mediaType==='audio')remoteUser.audioTrack.play();});await rtcClient.join(data.app_id,data.channel,data.token,data.uid);$('playerState').textContent='متصل بالبث المباشر عبر Agora.';}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}
function err(t){$('pageError').textContent=t;$('pageError').classList.remove('hidden')}
function addMessage(m,p){const d=document.createElement('div');d.className='msg';const n=document.createElement('strong');n.textContent=(p?.display_name||p?.username||'لاعب')+':';const s=document.createElement('span');s.textContent=m.message;d.append(n,s);$('chatMessages').append(d);$('chatMessages').scrollTop=$('chatMessages').scrollHeight}
async function load(){if(!streamId){err('رابط البث غير مكتمل. افتح البث من قائمة مجتمع Gaming Live.');$('playerState').textContent='لم يتم تحديد بث.';return}
const auth=await db.auth.getSession();user=auth.data.session?.user||null;
const r=await db.from('stream_sessions').select('id,host_user_id,category_id,title,description,status,provider,playback_uid,playback_url,thumbnail_url,viewer_count,started_at').eq('id',streamId).maybeSingle();if(r.error)throw r.error;if(!r.data)throw new Error('البث غير موجود أو غير متاح للمشاهدة.');session=r.data;
$('streamTitle').textContent=session.title;$('streamDescription').textContent=session.description||'لا يوجد وصف.';$('viewerCount').textContent=Number(session.viewer_count||0).toLocaleString('ar-SA')+' مشاهد';$('streamState').textContent=session.status==='live'?'مباشر':session.status;if(session.status==='live'&&session.provider==='agora_rtc'){await joinAgoraViewer();}else if(session.status==='live'&&session.playback_url){await playLive(session.playback_url);}else{$('playerState').textContent=session.status==='live'?'رابط المشاهدة غير متاح.':'هذا البث ليس مباشرًا حاليًا.';}
const cat=await db.from('game_categories').select('name').eq('id',session.category_id).maybeSingle();$('gameName').textContent=cat.data?.name||'ألعاب';
const pr=await db.from('player_profiles').select('user_id,username,display_name,avatar_url').eq('user_id',session.host_user_id).maybeSingle();profile=pr.data;$('hostName').textContent=profile?.display_name||profile?.username||'لاعب';$('hostHandle').textContent=profile?.username?'@'+profile.username:'';$('hostAvatar').textContent=(profile?.display_name||profile?.username||'ل').slice(0,1);
if(user&&profile){const f=await db.from('player_follows').select('follower_user_id').eq('follower_user_id',user.id).eq('followed_user_id',profile.user_id).maybeSingle();$('followBtn').textContent=f.data?'إلغاء المتابعة':'متابعة اللاعب';}else{$('followBtn').textContent='سجّل الدخول للمتابعة'}
await loadMessages();if(session.status==='live'){channel=db.channel('gl-chat-'+streamId).on('postgres_changes',{event:'INSERT',schema:'gaming_live',table:'stream_messages',filter:'session_id=eq.'+streamId},async payload=>{const msg=payload.new;const p=await db.from('player_profiles').select('username,display_name').eq('user_id',msg.user_id).maybeSingle();addMessage(msg,p.data);}).subscribe();}
$('chatHint').textContent=user?'التعليقات تخضع لإشراف مجتمع القيمنق.':'سجّل الدخول من سوق القيمنق لإرسال تعليق.';
}
async function loadMessages(){const r=await db.from('stream_messages').select('id,user_id,message,created_at').eq('session_id',streamId).eq('state','visible').order('created_at',{ascending:true}).limit(100);if(r.error)throw r.error;$('chatMessages').innerHTML='';if(!r.data.length){$('chatMessages').innerHTML='<div class="empty">لا توجد تعليقات بعد. ابدأ المحادثة باحترام.</div>';return}const ids=[...new Set(r.data.map(x=>x.user_id))];const ps=await db.from('player_profiles').select('user_id,username,display_name').in('user_id',ids);const map=new Map((ps.data||[]).map(p=>[p.user_id,p]));r.data.forEach(m=>addMessage(m,map.get(m.user_id)));}
$('followBtn').addEventListener('click',async()=>{if(!user){toast('سجّل الدخول أولًا من سوق القيمنق.');return}if(!profile||profile.user_id===user.id){toast('لا يمكنك متابعة نفسك.');return}const q=await db.from('player_follows').select('follower_user_id').eq('follower_user_id',user.id).eq('followed_user_id',profile.user_id).maybeSingle();let res;if(q.data)res=await db.from('player_follows').delete().eq('follower_user_id',user.id).eq('followed_user_id',profile.user_id);else res=await db.from('player_follows').insert({follower_user_id:user.id,followed_user_id:profile.user_id});if(res.error){toast(res.error.message);return}$('followBtn').textContent=q.data?'متابعة اللاعب':'إلغاء المتابعة';});
$('chatForm').addEventListener('submit',async e=>{e.preventDefault();const text=$('chatInput').value.trim();if(!text)return;if(!user){toast('سجّل الدخول لإرسال تعليق.');return}if(!session||session.status!=='live'){toast('التعليقات متاحة أثناء البث المباشر فقط.');return}const r=await db.from('stream_messages').insert({session_id:streamId,user_id:user.id,message:text});if(r.error){toast(r.error.message);return}$('chatInput').value='';});
load().catch(e=>{console.error(e);err(e.message||'تعذر تحميل البث.');$('playerState').textContent='تعذر تحميل بيانات البث.';});
window.addEventListener('beforeunload',()=>{if(channel)db.removeChannel(channel);if(rtcClient)rtcClient.leave().catch(()=>{})});
})();
</script></body></html>

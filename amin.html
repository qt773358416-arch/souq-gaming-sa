<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة سوق القيمنق السعودي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0c1322;--panel:#151f33;--panel2:#202d45;--text:#f3f6ff;--muted:#aab6ce;--line:#30415e;--brand:#8daeff;--good:#1c7657;--bad:#87364b;--warn:#72551d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.65}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:800}.primary{background:#9db8ff;color:#101a32}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.good{background:#164d3c;color:#d9ffef;border:1px solid #28795c}.bad{background:#552636;color:#ffe5eb;border:1px solid #87364b}.warn{background:#51401c;color:#fff0c7;border:1px solid #806528}.wrap{max-width:1180px;margin:auto;padding:18px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.top{margin-bottom:18px}.top h1{margin:0;color:var(--brand);font-size:clamp(22px,4vw,32px)}.muted{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin:13px 0}.field{width:100%;background:#0d1729;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:grid;gap:6px;color:var(--muted);font-size:13px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--panel2);border:1px solid var(--line);padding:13px;border-radius:12px;color:var(--muted)}.stat strong{display:block;color:var(--brand);font-size:25px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:14px 0}.ad{border:1px solid var(--line);background:#111b2d;border-radius:13px;padding:14px;margin:12px 0}.ad h3{margin:0;color:var(--brand)}.meta{font-size:13px;color:var(--muted);margin:5px 0 10px}.desc{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:var(--panel2);font-size:12px}.message{padding:11px;border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#14263b}.fault{color:#ffd7a6}.pledge{color:#9edaff}.empty{text-align:center;padding:25px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}@media(max-width:650px){.wrap{padding:11px}.stats{grid-template-columns:1fr 1fr}.filters,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:13px}}
</style></head>
<body><main class="wrap">
<header class="top"><div><h1>لوحة إدارة سوق القيمنق السعودي</h1><div class="muted">مراجعة الإعلانات وإدارة حالتها — لوحة مستقلة عن المتجر</div></div><div class="row"><a href="./" style="color:var(--brand)">العودة للموقع</a><button id="logout" class="secondary hidden">تسجيل الخروج</button></div></header>
<section id="login" class="panel"><h2>دخول مشرف المنصة</h2><p class="muted">أدخل بريد المشرف لاستلام رمز تحقق من 6 أرقام.</p><form id="loginForm" class="formgrid"><label class="full">البريد الإلكتروني<input id="email" class="field" type="email" required autocomplete="email"></label><div class="full"><button id="sendCode" class="primary">إرسال رمز الدخول</button></div><label id="otpWrap" class="full hidden">رمز التحقق<input id="otp" class="field" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></label><div id="otpActions" class="full row hidden"><button type="button" id="verifyCode" class="primary">تأكيد الدخول</button><button type="button" id="resend" class="secondary">إعادة إرسال</button></div></form><div id="loginMsg" class="message" role="status">أدخل بريد المشرف للمتابعة.</div></section>
<section id="dashboard" class="hidden"><div class="stats"><div class="stat">كل الإعلانات<strong id="total">—</strong></div><div class="stat">بانتظار المراجعة<strong id="pending">—</strong></div><div class="stat">منشورة<strong id="published">—</strong></div><div class="stat">مرفوضة / مؤرشفة<strong id="closed">—</strong></div></div>
<section class="panel"><div class="row"><h2 style="margin:0">إدارة الإعلانات</h2><button id="refresh" class="secondary">تحديث القائمة</button></div><div class="filters"><input id="search" class="field" placeholder="ابحث بالعنوان أو المدينة أو اسم البائع"><select id="statusFilter" class="field"><option value="all">كل الحالات</option><option value="pending">بانتظار المراجعة</option><option value="published">منشور</option><option value="rejected">مرفوض</option><option value="archived">مؤرشف</option></select><select id="sort" class="field"><option value="new">الأحدث أولًا</option><option value="old">الأقدم أولًا</option></select></div><div id="listMsg" class="muted" role="status"></div><div id="adsList"></div></section></section>
</main>
<script>
const SUPABASE_URL='https://hmcsgkavqdsfwqomxakw.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_I2FLI3drU7_xB8tWWGjnOg_b6Sm2j2m';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let adminEmail='',allAds=[];
const allowed=u=>!!(u?.app_metadata?.platform_admin===true);
function statusName(s){return ({pending:'بانتظار المراجعة',published:'منشور',rejected:'مرفوض',archived:'مؤرشف'})[s]||s||'غير محدد'}
function showDash(){ $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');loadAds(); }
async function checkSession(){const {data:{session}}=await sb.auth.getSession();if(session?.user&&allowed(session.user))showDash();else if(session?.user){$('loginMsg').textContent='هذا الحساب لا يحمل صلاحية مشرف المنصة. يجب تفعيل platform_admin في app_metadata.';await sb.auth.signOut();}}
$('loginForm').onsubmit=async e=>{e.preventDefault();adminEmail=$('email').value.trim().toLowerCase();$('sendCode').disabled=true;$('loginMsg').textContent='جارٍ إرسال رمز التحقق...';try{const {error}=await sb.auth.signInWithOtp({email:adminEmail,options:{shouldCreateUser:false}});if(error)throw error;$('otpWrap').classList.remove('hidden');$('otpActions').classList.remove('hidden');$('loginMsg').textContent='تم إرسال الرمز إلى بريدك.';$('otp').focus();}catch(err){$('loginMsg').textContent='تعذر الإرسال: '+err.message;}finally{$('sendCode').disabled=false;}};
$('resend').onclick=()=>$('loginForm').requestSubmit();
$('verifyCode').onclick=async()=>{const token=$('otp').value.trim();if(!/^\d{6}$/.test(token)){$('loginMsg').textContent='أدخل رمزًا مكوّنًا من 6 أرقام.';return;}try{const {data,error}=await sb.auth.verifyOtp({email:adminEmail,token,type:'email'});if(error)throw error;if(!allowed(data.user)){await sb.auth.signOut();$('loginMsg').textContent='تم التحقق، لكن الحساب غير مفعّل كمشرف منصة.';return;}showDash();}catch(err){$('loginMsg').textContent='تعذر التحقق: '+err.message;}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function loadAds(){ $('listMsg').textContent='جارٍ تحميل الإعلانات...';const {data,error}=await sb.from('ads').select('id,title,price,category,city,seller_name,seller_phone,description,status,created_at,product_safety_pledged,product_fault_details,seller_id').order('created_at',{ascending:false}).limit(500);if(error){$('listMsg').textContent='تعذر تحميل الإعلانات: '+error.message+' — تحقق من تشغيل ملف SQL وسياسات الوصول.';$('adsList').innerHTML='';return;}allAds=data||[];const count=s=>allAds.filter(a=>a.status===s).length;$('total').textContent=allAds.length;$('pending').textContent=count('pending');$('published').textContent=count('published');$('closed').textContent=count('rejected')+' / '+count('archived');renderAds();}
function renderAds(){let rows=[...allAds];const q=$('search').value.trim().toLowerCase(),st=$('statusFilter').value;if(st!=='all')rows=rows.filter(a=>a.status===st);if(q)rows=rows.filter(a=>[a.title,a.city,a.seller_name,a.category].some(v=>String(v||'').toLowerCase().includes(q)));if($('sort').value==='old')rows.reverse();$('adsList').innerHTML=rows.length?rows.map(a=>`<article class="ad"><div class="row"><h3>${esc(a.title||'إعلان بلا عنوان')}</h3><span class="pill">${esc(statusName(a.status))}</span></div><div class="meta">${esc(a.category)} · ${esc(a.city)} · ${Number(a.price||0).toLocaleString('ar-SA')} ر.س · ${a.created_at?new Date(a.created_at).toLocaleString('ar-SA'):''}</div><div><strong>البائع:</strong> ${esc(a.seller_name)} · ${esc(a.seller_phone)}</div><p class="desc">${esc(a.description||'لا يوجد وصف')}</p>${a.product_safety_pledged?'<div class="pledge">✓ البائع متعهد بسلامة المنتج</div>':''}${a.product_fault_details?`<div class="fault">العيوب المعلنة: ${esc(a.product_fault_details)}</div>`:''}<div class="actions"><button class="good" onclick="setAdStatus('${esc(a.id)}','published')">قبول ونشر</button><button class="bad" onclick="setAdStatus('${esc(a.id)}','rejected')">رفض الإعلان</button><button class="warn" onclick="setAdStatus('${esc(a.id)}','archived')">أرشفة</button><button class="secondary" onclick="setAdStatus('${esc(a.id)}','pending')">إعادته للمراجعة</button></div></article>`).join(''):'<div class="empty">لا توجد إعلانات تطابق البحث.</div>';}
window.setAdStatus=async(id,status)=>{if(!allowed((await sb.auth.getUser()).data.user)){alert('انتهت جلسة المشرف.');return;}const a=allAds.find(x=>String(x.id)===String(id));if(!a)return;if(!confirm(`تأكيد تغيير حالة الإعلان إلى: ${statusName(status)}؟`))return;const {error}=await sb.from('ads').update({status}).eq('id',id);if(error){alert('تعذر تحديث الإعلان: '+error.message);return;}await loadAds();};
$('refresh').onclick=loadAds;$('search').oninput=renderAds;$('statusFilter').onchange=renderAds;$('sort').onchange=renderAds;sb.auth.onAuthStateChange((_e,session)=>{if(session?.user&&allowed(session.user)&&$('dashboard').classList.contains('hidden'))showDash();});checkSession();
</script></body></html>

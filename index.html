<style>
:root {
  --bg: #050811;
  --panel: #0c1220;
  --panel2: #111c30;
  --text: #f4f8ff;
  --muted: #9aaac3;
  --line: #20314b;
  --brand: #087cff;
  --green: #19d99b;
  --red: #ff456c;
  --glow: 0 0 22px rgba(0,132,255,.16);
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 20px;
}

body {
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(ellipse at 10% 0%, rgba(0,112,255,.12), transparent 35%),
    radial-gradient(ellipse at 95% 15%, rgba(125,40,255,.09), transparent 32%),
    var(--bg);
  font-family: system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,input,textarea,select { font: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { opacity: .5; cursor: not-allowed; }
a { color: #63b7ff; overflow-wrap: anywhere; }

button {
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 11px 15px;
  font-weight: 750;
  transition: background .2s,border-color .2s,transform .2s;
}

button:active { transform: scale(.97); }

.primary {
  color: white;
  background: linear-gradient(135deg,#0788ff,#075de4);
  box-shadow: 0 5px 18px rgba(0,113,255,.2);
}

.primary:hover {
  background: linear-gradient(135deg,#36a4ff,#1268ff);
}

.secondary {
  color: #e5f0ff;
  background: linear-gradient(145deg,#111e33,#0b1424);
  border-color: #263c5b;
}

.secondary:hover,.chip:hover {
  border-color: #168dff;
  background: #142641;
}

.danger {
  color: #fff;
  background: #49172b;
  border-color: #77243d;
}

.field {
  width: 100%;
  min-width: 0;
  min-height: 46px;
  padding: 12px 14px;
  color: #f4f8ff;
  background: #080e1b;
  border: 1px solid #263650;
  border-radius: 12px;
  outline: none;
  transition: border-color .2s,box-shadow .2s;
}

.field:focus {
  border-color: #168dff;
  box-shadow: 0 0 0 3px rgba(22,141,255,.13);
}

.field::placeholder { color: #7486a2; }
textarea.field { resize: vertical; }
select.field { color-scheme: dark; }

label {
  display: block;
  color: #b9c9e0;
  font-size: 13px;
  margin-bottom: 7px;
}

.wrap {
  width: 100%;
  max-width: 1320px;
  margin: auto;
  padding: 18px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  padding: 16px 20px;
  background: linear-gradient(120deg,#0d192b,#0a1020 65%,#11102a);
  border: 1px solid #243b5a;
  border-radius: 18px;
  box-shadow: var(--glow);
}

.brand {
  font-weight: 950;
  font-size: clamp(18px,2.3vw,25px);
  letter-spacing: -.5px;
  color: #f5f9ff;
}

.brand::first-letter { color: #27a8ff; }

.search {
  display: flex;
  gap: 8px;
  flex: 1;
  max-width: 550px;
  min-width: 200px;
}

.search .field { border-radius: 14px; }

.panel,.card {
  background: linear-gradient(145deg,rgba(15,25,43,.98),rgba(8,14,26,.98));
  border: 1px solid #1e304a;
  border-radius: 17px;
  overflow: hidden;
  box-shadow: 0 8px 28px rgba(0,0,0,.13);
}

.panel { padding: 20px; margin: 16px 0; }

.hero {
  position: relative;
  overflow: hidden;
  padding: clamp(22px,5vw,48px);
  background:
    radial-gradient(ellipse at 85% 15%,rgba(0,136,255,.25),transparent 40%),
    radial-gradient(ellipse at 10% 100%,rgba(136,50,255,.2),transparent 45%),
    linear-gradient(120deg,#101e35,#0a1020 60%,#17112c);
  border: 1px solid #29486f;
  border-radius: 22px;
  margin: 18px 0;
  box-shadow: 0 12px 40px rgba(0,0,0,.22);
}

.hero h1 {
  max-width: 750px;
  margin: 0 0 12px;
  font-size: clamp(25px,4vw,42px);
  line-height: 1.4;
  letter-spacing: -.8px;
}

.hero p {
  max-width: 650px;
  line-height: 1.9;
  font-size: 15px;
}

.hero .primary {
  min-height: 48px;
  padding-inline: 23px;
}

h2 { font-size: clamp(19px,2.4vw,26px); }
h3 { line-height: 1.6; }

.muted,.meta {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 15px;
}

.card {
  min-width: 0;
  transition: transform .2s,border-color .2s,box-shadow .2s;
}

.card:hover {
  border-color: #2366a6;
  box-shadow: 0 10px 30px rgba(0,112,255,.12);
}

.adimg {
  display: block;
  width: 100%;
  height: 220px;
  object-fit: cover;
  background:
    radial-gradient(circle at center,rgba(0,120,255,.14),transparent 65%),
    #090f1c;
}

.adbody { padding: 15px; min-width: 0; }

.adbody h3 {
  color: #eaf4ff;
  margin: 0 0 7px;
  font-size: 16px;
  overflow-wrap: anywhere;
}

.price {
  color: #42b5ff;
  font-size: 21px;
  font-weight: 950;
  margin: 5px 0;
  text-shadow: 0 0 15px rgba(0,136,255,.14);
}

.adbody p {
  font-size: 13px;
  line-height: 1.8;
  color: #b3c1d6;
  overflow-wrap: anywhere;
}

.actions,.row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.actions button { flex: 1 1 auto; }
.space { justify-content: space-between; }

.formgrid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 16px;
}

.full { grid-column: 1/-1; }
.stack { display: grid; gap: 13px; }
.hidden { display: none !important; }

.notice,.empty {
  padding: 15px;
  border: 1px solid #243853;
  border-radius: 13px;
  background: #0b1423;
  margin: 10px 0;
  overflow-wrap: anywhere;
}

.notice { line-height: 1.9; }
.empty { text-align: center; color: var(--muted); }

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 18px 0;
}

.chip {
  color: #dbeaff;
  background: #0d192b;
  border-color: #243953;
  border-radius: 999px;
  padding: 10px 17px;
  white-space: nowrap;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
  gap: 12px;
  margin: 18px 0;
}

.gallery img {
  width: 100%;
  height: 210px;
  object-fit: contain;
  background: #070d18;
  border: 1px solid #20314b;
  border-radius: 13px;
}

hr { border: 0; border-top: 1px solid var(--line); }

.footer {
  text-align: center;
  color: #71829b;
  padding: 30px 0;
  font-size: 12px;
  line-height: 1.8;
}

.bottom { display: none; }

@media (min-width: 761px) {
  .bottom { display: none !important; }
}

@media (max-width: 760px) {
  body { font-size: 14px; }

  .wrap {
    padding: 10px 10px calc(95px + env(safe-area-inset-bottom));
  }

  .top {
    padding: 13px;
    gap: 11px;
    border-radius: 16px;
  }

  .brand {
    width: 100%;
    font-size: 19px;
    text-align: center;
  }

  .search {
    max-width: none;
    min-width: 0;
    flex: 1 1 100%;
    order: 2;
  }

  .search .field { min-width: 0; }
  .top > .row { width: 100%; margin: 0; }
  .top > .row button { flex: 1; }

  .hero {
    padding: 23px 18px;
    border-radius: 17px;
    margin: 12px 0;
  }

  .hero h1 { font-size: 25px; }
  .hero p { font-size: 13px; }

  .categories {
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 7px;
    scrollbar-width: thin;
  }

  .chip { flex: 0 0 auto; padding: 9px 13px; }

  .grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 9px;
  }

  .adimg { height: clamp(115px,35vw,175px); }
  .adbody { padding: 10px; }
  .adbody h3 { font-size: 14px; }
  .price { font-size: 17px; }
  .meta { font-size: 11px; }
  .adbody p { font-size: 12px; }

  .actions { gap: 6px; }
  .actions button {
    font-size: 11px;
    padding: 9px 7px;
    min-height: 38px;
  }

  .formgrid { grid-template-columns: minmax(0,1fr); gap: 13px; }
  .full { grid-column: auto; }

  .panel {
    padding: 14px;
    margin: 12px 0;
    border-radius: 15px;
  }

  .gallery { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .gallery img { height: 160px; }

  .bottom {
    position: fixed;
    display: grid;
    grid-template-columns: repeat(4,minmax(0,1fr));
    align-items: center;
    gap: 2px;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 8px 5px calc(8px + env(safe-area-inset-bottom));
    background: rgba(5,10,20,.96);
    border-top: 1px solid #243a58;
    box-shadow: 0 -8px 28px rgba(0,0,0,.35);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .bottom button {
    min-width: 0;
    min-height: 48px;
    padding: 7px 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 3px;
    color: #aabbd2;
    background: transparent;
    border: 0;
    border-radius: 10px;
    font-size: 11px;
    white-space: nowrap;
  }

  .bottom button:nth-child(2) {
    color: white;
    background: linear-gradient(135deg,#087fff,#064cda);
    box-shadow: 0 0 17px rgba(0,124,255,.25);
  }

  .bottom button:hover { color: #56baff; }
  .footer { padding: 20px 8px; }
}

@media (max-width: 360px) {
  .grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
  .adbody { padding: 8px; }
  .adbody h3 { font-size: 12px; }
  .price { font-size: 15px; }
  .bottom button { font-size: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>

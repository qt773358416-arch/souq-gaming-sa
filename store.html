<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><title>المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--store-bg:#0b1020;--store-surface:#121a2b;--store-surface-2:#19243a;--store-text:#f5f7fb;--store-muted:#a4afc3;--store-primary:#8b5cf6;--store-secondary:#22d3ee;--store-border:rgba(255,255,255,.10);--store-radius:20px;--store-font:'IBM Plex Sans Arabic',Tahoma,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--store-bg);color:var(--store-text);font-family:var(--store-font)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.container{width:min(1220px,92%);margin:auto}
.announcement{display:none;background:var(--store-primary);padding:9px;text-align:center}.announcement.visible{display:block}
header{position:sticky;top:0;z-index:20;background:#0b1020ed;border-bottom:1px solid var(--store-border);backdrop-filter:blur(15px)}.header-inner{min-height:72px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;min-width:0}.brand img{width:42px;height:42px;object-fit:contain;border-radius:12px}.nav{display:flex;gap:18px;flex:1}.nav a{color:var(--store-muted);font-size:13px}.actions{display:flex;gap:8px}.icon{border:1px solid var(--store-border);border-radius:12px;background:var(--store-surface);color:white;padding:10px 13px}
.hero{padding:25px 0}.hero-panel{display:none;grid-template-columns:1fr .8fr;align-items:center;gap:20px;padding:35px;border:1px solid var(--store-border);border-radius:var(--store-radius);background:linear-gradient(115deg,var(--store-surface),color-mix(in srgb,var(--store-primary) 28%,var(--store-surface)));overflow:hidden}.hero-panel.visible{display:grid}.hero h1{font-size:clamp(28px,4vw,48px);margin:0 0 10px}.hero p{color:var(--store-muted);line-height:1.9}.hero img{max-width:100%;max-height:260px;object-fit:contain;border-radius:14px}
.section{margin:32px auto}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.heading h2{margin:0}.muted{color:var(--store-muted);font-size:13px}
.categories{display:flex;gap:9px;overflow:auto}.chip{border:1px solid var(--store-border);background:var(--store-surface);color:var(--store-text);border-radius:12px;padding:10px 14px;white-space:nowrap}.chip.active{border-color:var(--store-primary);background:color-mix(in srgb,var(--store-primary) 20%,var(--store-surface))}
.toolbar{display:flex;gap:9px;margin:12px 0}.field{background:var(--store-surface);border:1px solid var(--store-border);border-radius:12px;color:var(--store-text);padding:12px;min-width:0}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.product{background:var(--store-surface);border:1px solid var(--store-border);border-radius:16px;overflow:hidden;min-width:0}.product img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--store-surface-2)}.product-body{padding:12px}.product h3{font-size:14px;margin:5px 0 8px;min-height:2.8em}.price{font-size:17px;font-weight:700}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--store-primary);color:white;font-weight:700}.product .btn{width:100%;margin-top:10px}.promo{display:none;padding:22px;border-radius:18px;background:var(--store-surface-2);border:1px solid var(--store-border)}.promo.visible{display:block}.promo img{max-width:120px;max-height:90px;object-fit:contain;float:left}.footer{margin-top:50px;border-top:1px solid var(--store-border);padding:25px 0;color:var(--store-muted)}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:40}.overlay.visible{display:block}.drawer{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(400px,92vw);background:var(--store-surface);padding:18px;transform:translateX(-105%);transition:.2s;display:flex;flex-direction:column}.drawer.open{transform:none}.cartlines{overflow:auto;flex:1}.cartline{padding:12px 0;border-bottom:1px solid var(--store-border);display:flex;justify-content:space-between;gap:10px}.toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:var(--store-surface-2);border:1px solid var(--store-border);padding:10px 16px;border-radius:12px;display:none;z-index:80}.toast.show{display:block}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.header-inner{min-height:62px;gap:8px}.brand{font-size:15px}.nav{display:none}.actions{margin-right:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.product-body{padding:9px}.product h3{font-size:12px}.hero-panel.visible{display:block;padding:20px}.hero-panel img{max-height:145px}.toolbar{flex-direction:column}.field{width:100%}.section{margin:25px auto}}
</style></head>
<body>
<div class="announcement" id="announcement"></div>
<header><div class="container header-inner">
<a class="brand" href="#" id="brand"><img id="logo" hidden alt=""><span id="storeName">المتجر</span></a>
<nav class="nav" id="nav"></nav>
<div class="actions"><button class="icon" id="backBtn">رجوع للسوق</button><button class="icon" id="cartBtn">🛒 <span id="cartCount">0</span></button></div>
</div></header>
<main>
<section class="hero container"><div class="hero-panel" id="hero"><div><small id="kicker"></small><h1 id="heroTitle"></h1><p id="heroDesc"></p><button class="btn" id="heroAction">تصفح المنتجات</button></div><div id="heroImage"></div></div></section>
<section class="section container" id="categorySection"><div class="heading"><div><h2 id="categoryTitle">التصنيفات</h2><p class="muted" id="categorySubtitle"></p></div></div><div class="categories" id="categories"></div></section>
<section class="section container" id="productSection"><div class="heading"><div><h2 id="productTitle">المنتجات</h2><p class="muted" id="productSubtitle"></p></div><span class="muted" id="productCount"></span></div><div class="toolbar"><input class="field" id="search" placeholder="ابحث في منتجات المتجر"><select class="field" id="sort"><option value="default">ترتيب المنتجات</option><option value="low">السعر الأقل</option><option value="high">السعر الأعلى</option></select></div><div class="grid" id="products"></div><p class="muted" id="empty" hidden>لا توجد منتجات معروضة حالياً.</p></section>
<section class="section container"><div class="promo" id="promo"><img id="promoImage" alt=""><h3 id="promoTitle"></h3><p id="promoText"></p></div></section>
<section class="section container" id="policySection"><div class="heading"><h2>معلومات المتجر</h2></div><div class="muted" id="policies"></div></section>
</main>
<footer class="footer"><div class="container" id="footerText"></div></footer>
<div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><div class="heading"><h3>سلة التسوق</h3><button class="icon" id="closeCart">إغلاق</button></div><div class="cartlines" id="cartLines"></div><p>الإجمالي: <b id="total">0</b> ر.س</p><button class="btn" id="checkoutBtn">متابعة الشراء</button></aside><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://hmcsgkavqdsfwqomxakw.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_I2FLI3drU7_xB8tWWGjnOg_b6Sm2j2m';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);const slug=params.get('slug');let store=null,prefs={},products=[],cart=[];
const cartKey=()=>`souq-store-cart:${store?.id||slug}`;
function notify(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function safeUrl(u){try{const x=new URL(u,location.origin);return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}}
function money(v){return Number(v||0).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2})}
function setTheme(){const f=prefs.storefront||{};if(/^#[0-9a-f]{6}$/i.test(f.theme_color||''))document.documentElement.style.setProperty('--store-primary',f.theme_color)}
function renderIdentity(){const f=prefs.storefront||{};document.title=store.store_name;$('storeName').textContent=store.store_name;$('footerText').textContent=store.description||store.store_name;
const logo=safeUrl(store.logo_url);if(logo){$('logo').src=logo;$('logo').hidden=false}
if(f.show_announcement&&f.announcement){$('announcement').textContent=f.announcement;$('announcement').classList.add('visible')}
if(f.whatsapp&&f.show_whatsapp){const a=document.createElement('a');a.href='https://wa.me/'+f.whatsapp.replace(/\D/g,'');a.textContent='واتساب المتجر';a.target='_blank';a.rel='noopener';$('nav').append(a)}
const links=prefs.channel_links||{};if(f.show_social_links)Object.entries(links).forEach(([k,v])=>{const u=safeUrl(v);if(u){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent=k;$('nav').append(a)}})}
function renderHero(){const f=prefs.storefront||{};if(!f.show_banner||!f.banner_url)return;$('hero').classList.add('visible');$('heroTitle').textContent=store.store_name;$('heroDesc').textContent=store.description||'';const im=safeUrl(f.banner_url);if(im){const i=document.createElement('img');i.src=im;i.alt='';$('heroImage').append(i)}$('heroAction').onclick=()=>$('productSection').scrollIntoView({behavior:'smooth'})}
function renderCategories(){const names=[...new Set(products.map(p=>p.category).filter(Boolean))];$('categories').innerHTML='<button class="chip active" data-cat="all">الكل</button>'+names.map(n=>`<button class="chip" data-cat="${esc(n)}">${esc(n)}</button>`).join('');$('categories').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));renderProducts(b.dataset.cat)})}
let category='all';function renderProducts(cat=category){category=cat;const q=$('search').value.trim().toLowerCase();let rows=products.filter(p=>(category==='all'||p.category===category)&&String(p.title||'').toLowerCase().includes(q));if($('sort').value==='low')rows.sort((a,b)=>Number(a.price)-Number(b.price));if($('sort').value==='high')rows.sort((a,b)=>Number(b.price)-Number(a.price));$('productCount').textContent=rows.length+' منتج';$('empty').hidden=!!rows.length;$('products').innerHTML=rows.map(p=>`<article class="product"><img src="${esc(safeUrl(p.image_url)||'')}" alt="${esc(p.title)}" loading="lazy"><div class="product-body"><small class="muted">${esc(p.category||'')}</small><h3>${esc(p.title)}</h3><div class="price">${money(p.price)} ر.س</div><button class="btn" data-add="${esc(p.id)}">أضف للسلة</button></div></article>`).join('');$('products').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add))}
function saveCart(){localStorage.setItem(cartKey(),JSON.stringify(cart))}
function add(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const f=cart.find(x=>String(x.id)===String(id));if(f)f.qty++;else cart.push({...p,qty:1});saveCart();renderCart();notify('تمت إضافة المنتج إلى السلة')}
function renderCart(){$('cartCount').textContent=cart.reduce((n,x)=>n+x.qty,0);$('cartLines').innerHTML=cart.map(p=>`<div class="cartline"><span>${esc(p.title)} × ${p.qty}</span><b>${money(p.price*p.qty)} ر.س</b></div>`).join('')||'<p class="muted">السلة فارغة.</p>';$('total').textContent=money(cart.reduce((n,x)=>n+Number(x.price)*x.qty,0))}
function openCart(){$('drawer').classList.add('open');$('overlay').classList.add('visible')}function closeCart(){$('drawer').classList.remove('open');$('overlay').classList.remove('visible')}
async function checkout(){if(!cart.length){notify('السلة فارغة');return}const name=prompt('اسم العميل');if(!name)return;const phone=prompt('رقم الجوال');if(!phone)return;const city=prompt('المدينة');if(!city)return;const address=prompt('العنوان بالتفصيل');if(!address)return;const btn=$('checkoutBtn');btn.disabled=true;try{const {data,error}=await sb.rpc('create_vendor_checkout_draft',{p_items:cart.map(x=>({product_id:x.id,quantity:x.qty})),p_customer_name:name,p_phone:phone,p_city:city,p_address:address,p_notes:''});if(error)throw error;const id=typeof data==='string'?data:(data?.checkout_id||data?.id||'');cart=[];saveCart();renderCart();notify('تم إنشاء طلب مبدئي '+id+' — لم يتم تحصيل أي مبلغ')}catch(e){notify('تعذر إنشاء الطلب: '+e.message)}finally{btn.disabled=false}}
async function boot(){if(!slug){document.body.innerHTML='<main class="container"><h2>رابط المتجر غير مكتمل</h2></main>';return}
const {data:st,error}=await sb.from('vendor_stores').select('id,store_name,slug,category,city,logo_url,description,contact_whatsapp,status').eq('slug',slug).eq('status','approved').maybeSingle();if(error||!st){document.body.innerHTML='<main class="container"><h2>المتجر غير متاح حالياً</h2><p>تأكد من الرابط أو أن المتجر معتمد.</p></main>';return}store=st;
const [pr,ps]=await Promise.all([sb.from('vendor_store_products').select('id,title,category,price,stock_quantity,product_type,image_url,description,status,created_at').eq('store_id',store.id).eq('status','approved').order('created_at',{ascending:false}).limit(300),sb.from('vendor_store_public_preferences').select('public_settings').eq('store_id',store.id).maybeSingle()]);
if(pr.error){notify('تعذر تحميل المنتجات: '+pr.error.message);return}products=(pr.data||[]).filter(p=>Number(p.stock_quantity)>0||!(ps.data?.public_settings?.storefront?.hide_out_of_stock));prefs=ps.data?.public_settings||{};setTheme();renderIdentity();renderHero();renderCategories();renderProducts();try{cart=JSON.parse(localStorage.getItem(cartKey())||'[]').filter(x=>products.some(p=>String(p.id)===String(x.id)))}catch{cart=[]}renderCart()}
$('backBtn').onclick=()=>{if(history.length>1)history.back();else location.href='index.html#vendors'};$('brand').onclick=e=>e.preventDefault();$('cartBtn').onclick=openCart;$('closeCart').onclick=closeCart;$('overlay').onclick=closeCart;$('checkoutBtn').onclick=checkout;$('search').oninput=()=>renderProducts();$('sort').onchange=()=>renderProducts();boot();
})();
</script></body></html>
